name: Flutter CI - Build Android & Desktop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Java (for Android build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Flutter and Android toolchain
        run: |
          flutter --version
          sudo apt-get update -y
          sudo apt-get install -y curl unzip
          flutter doctor -v || true
          yes | flutter doctor --android-licenses || true

      - name: Ensure project platforms and get dependencies
        run: |
          # If platform folders are missing, initialize them
          if [ ! -d "android" ] || [ ! -d "windows" ] || [ ! -d "linux" ]; then
            flutter create . || true
          fi
          flutter pub get

      - name: Run tests
        run: |
          flutter test --no-pub --enable-experiment=dot-shorthands 2>&1 | tee test.log || true

      - name: Upload test log
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log

      - name: Build APK (release)
        run: |
          flutter build apk --release --enable-experiment=dot-shorthands 2>&1 | tee build-android.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload Android build log
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build-android.log

  build-windows:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Windows platform and dependencies
        run: |
          flutter config --enable-windows-desktop || true
          if [ ! -d "windows" ]; then
            flutter create --platforms=windows . || true
          fi
          flutter pub get

      - name: Build Windows (release)
        shell: powershell
        run: |
          flutter build windows --release --enable-experiment=dot-shorthands *>&1 | Tee-Object -FilePath build-windows.log

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows/runner/Release/**

      - name: Upload Windows build log
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: build-windows.log

  build-linux:
    name: Build Linux executable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install native build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev libssl-dev

      - name: Ensure Linux platform and dependencies
        run: |
          flutter config --enable-linux-desktop || true
          if [ ! -d "linux" ]; then
            flutter create --platforms=linux . || true
          fi
          flutter pub get

      - name: Build Linux (release)
        run: |
          flutter build linux --release --enable-experiment=dot-shorthands 2>&1 | tee build-linux.log

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/linux/**

      - name: Upload Linux build log
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-log
          path: build-linux.log
