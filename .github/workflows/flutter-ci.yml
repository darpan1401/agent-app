name: Flutter CI - Build Android & Desktop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Java (for Android build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Flutter and Android toolchain
        run: |
          flutter --version
          sudo apt-get update -y
          sudo apt-get install -y curl unzip
          flutter doctor -v || true
          yes | flutter doctor --android-licenses || true

      - name: Ensure project platforms and get dependencies
        run: |
          # If platform folders are missing, initialize them
          if [ ! -d "android" ] || [ ! -d "windows" ] || [ ! -d "linux" ]; then
            flutter create . || true
          fi
          flutter pub get

      - name: Run tests
        run: |
          flutter test --no-pub --enable-experiment=dot-shorthands 2>&1 | tee test.log || true

      - name: Upload test log
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log

      - name: Build APK (release)
        run: |
          flutter build apk --release --enable-experiment=dot-shorthands 2>&1 | tee build-android.log

      - name: Package APK(s) into zip
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip || true
          mkdir -p build/artifacts || true
          zip -j build/artifacts/android-build.zip build/app/outputs/flutter-apk/*.apk || true

      - name: Upload Android build artifact (zip)
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/artifacts/android-build.zip

      - name: Upload Android build log
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build-android.log

  build-windows:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Windows platform and dependencies
        shell: powershell
        run: |
          flutter config --enable-windows-desktop
          if (!(Test-Path -Path windows)) {
            flutter create --platforms=windows .
          }
          flutter pub get

      - name: Build Windows (release)
        shell: powershell
        run: |
          flutter build windows --release --enable-experiment=dot-shorthands *>&1 | Tee-Object -FilePath build-windows.log

      - name: "Debug: list build\\windows tree"
        shell: powershell
        run: |
          Write-Output '--- build/windows tree ---'
          if (Test-Path 'build\windows') { Get-ChildItem -Path 'build\windows' -Recurse -Force | Select-Object FullName, Mode, Length | Format-Table -AutoSize } else { Write-Output 'build\windows not found' }

      - name: Package Windows build into zip
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path 'build\artifacts' -Force | Out-Null
          $releaseDir = Get-ChildItem -Path 'build\windows' -Directory -Recurse -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -ieq 'Release' } | Select-Object -First 1
          if ($null -ne $releaseDir) {
            Write-Output "Found Release folder: $($releaseDir.FullName)"
            Compress-Archive -Path (Join-Path $releaseDir.FullName '*') -DestinationPath 'build\artifacts\windows-build.zip' -Force
          } else {
            Write-Output 'No windows Release folder found; creating placeholder zip'
            $zip = 'build\artifacts\windows-build.zip'
            $tmp = Join-Path $env:TEMP ("winpack-" + [Guid]::NewGuid().ToString())
            New-Item -ItemType Directory -Path $tmp | Out-Null
            New-Item -Path (Join-Path $tmp 'placeholder.txt') -ItemType File -Force | Out-Null
            Compress-Archive -Path (Join-Path $tmp '*') -DestinationPath $zip -Force
            Remove-Item -Recurse -Force $tmp
          }

      - name: "Debug: show created windows zip"
        shell: powershell
        run: |
          $zipPath = 'build\artifacts\windows-build.zip'
          if (Test-Path $zipPath) { Write-Output "ZIP exists: $zipPath"; Get-Item $zipPath | Format-List Name, FullName, Length } else { Write-Output 'ZIP not found after packaging' }

      - name: Upload Windows build artifact (zip)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/artifacts/windows-build.zip

      - name: Upload Windows build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: build-windows.log

  build-linux:
    name: Build Linux executable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install native build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev libssl-dev

      - name: Ensure Linux platform and dependencies
        run: |
          flutter config --enable-linux-desktop || true
          if [ ! -d "linux" ]; then
            flutter create --platforms=linux . || true
          fi
          flutter pub get

      - name: Build Linux (release)
        run: |
          flutter build linux --release --enable-experiment=dot-shorthands 2>&1 | tee build-linux.log

      - name: Package Linux build into zip
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip || true
          mkdir -p build/artifacts || true
          if [ -d "build/linux" ]; then
            zip -r build/artifacts/linux-build.zip build/linux || true
          else
            zip -r build/artifacts/linux-build.zip . || true
          fi

      - name: Upload Linux build artifact (zip)
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/artifacts/linux-build.zip

      - name: Upload Linux build log
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-log
          path: build-linux.log
